name: xdg_mime_db
description: Implementation of the freedesktop.org Shared MIME-info Database specification for reading the MIME database.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

resolution: workspace

# Add regular dependencies here.
dependencies:
